server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/aq_air?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${AQ_DB_USER:aq_user}
    password: ${AQ_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.aqp: info
